<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Görüntü İşleme Proje Ödevi</title>
  <meta name="description" content="Üniversite görüntü işleme dersi kapsamında geliştirilmiş proje ödevi." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

  <main class="workspace">

    <!-- Yükleme Paneli -->
    <section class="panel upload-panel">
      <h2 class="panel-title">Görüntü Yükle</h2>

      <label class="file-drop" id="fileDrop" for="fileInput">
        <span class="drop-icon">↑</span>
        <span class="drop-text">Buraya tıklayın veya bir görüntü sürükleyin</span>
        <span class="drop-hint">PNG / JPG / BMP · her boyutta</span>
        <input type="file" id="fileInput" accept="image/*" hidden />
      </label>

      <!-- İkinci Görüntü -->
      <div id="secondFileWrap" class="second-file hidden">
        <label class="section-label" for="fileInput2">İkinci Görüntü (Toplama / Bölme için)</label>
        <label class="file-drop file-drop--sm" for="fileInput2">
          <span class="drop-icon" style="font-size:1.2rem">↑</span>
          <span class="drop-text">İkinci görüntüyü seçin</span>
          <input type="file" id="fileInput2" accept="image/*" hidden />
        </label>
        <img id="previewImg2" class="preview-img preview-img--sm hidden" alt="İkinci görüntü önizleme" />
      </div>

      <!-- Parametreler -->
      <div class="params" id="paramsBox"></div>

      <button id="applyBtn" class="apply-btn hidden">Değişiklikleri Uygula</button>

      <div id="statusMsg" class="status-msg hidden"></div>
    </section>

    <!-- İşlem Paneli -->
    <section class="panel ops-panel">
      <h2 class="panel-title">İşlem Seçin</h2>

      <div class="ops-grid" id="opsGrid">

        <div class="ops-group">
          <h3 class="ops-group-title">Renk</h3>
          <button id="btn-grayscale"        class="op-btn" data-op="grayscale">Grayscale</button>
          <button id="btn-binary"           class="op-btn" data-op="binary"    data-params="threshold">Binary</button>
          <button id="btn-ntsc"             class="op-btn" data-op="ntsc">NTSC (YIQ)</button>
          <button id="btn-ycbcr"            class="op-btn" data-op="ycbcr">YCbCr</button>
          <button id="btn-cmy"              class="op-btn" data-op="cmy">CMY</button>
          <button id="btn-cmyk"             class="op-btn" data-op="cmyk">CMYK</button>
          <button id="btn-hsi"              class="op-btn" data-op="hsi">HSI</button>
          <button id="btn-xyz"              class="op-btn" data-op="xyz">CIE XYZ</button>
          <button id="btn-lab"              class="op-btn" data-op="lab">CIE L*a*b*</button>
          <button id="btn-luv"              class="op-btn" data-op="luv">CIE Luv</button>
        </div>

        <div class="ops-group">
          <h3 class="ops-group-title">Geometri</h3>
          <button id="btn-rotation"         class="op-btn" data-op="rotation"  data-params="angle">Rotate</button>
          <button id="btn-crop"             class="op-btn" data-op="crop"      data-params="x1,y1,x2,y2">Crop</button>
          <button id="btn-zoom"             class="op-btn" data-op="zoom"      data-params="scale,method">Zoom</button>
        </div>

        <div class="ops-group">
          <h3 class="ops-group-title">Histogram</h3>
          <button id="btn-histogram-stretch"  class="op-btn" data-op="histogram-stretch">Germe</button>
          <button id="btn-histogram-equalize" class="op-btn" data-op="histogram-equalize">Eşitleme</button>
          <button id="btn-histogram-expand"   class="op-btn" data-op="histogram-expand" data-params="a,b">Genişletme</button>
        </div>

        <div class="ops-group">
          <h3 class="ops-group-title">Aritmetik</h3>
          <button id="btn-add"    class="op-btn" data-op="add"    data-needs-second="true">Add Images</button>
          <button id="btn-divide" class="op-btn" data-op="divide" data-needs-second="true">Divide Images</button>
        </div>

        <div class="ops-group">
          <h3 class="ops-group-title">Contrast & Filter</h3>
          <button id="btn-brightness-multiply" class="op-btn" data-op="brightness-multiply" data-params="alpha">Brightness Ayar</button>
          <button id="btn-contrast-log"      class="op-btn" data-op="contrast-log" data-params="factor">Contrast Ayar</button>
          <button id="btn-mean-filter"       class="op-btn" data-op="mean-filter" data-params="size">Mean Filter</button>
          <button id="btn-unsharp"           class="op-btn" data-op="unsharp">Unsharp</button>
        </div>

        <div class="ops-group">
          <h3 class="ops-group-title">Threshold & Edge</h3>
          <button id="btn-threshold" class="op-btn" data-op="threshold" data-params="threshold_val">Threshold</button>
          <button id="btn-edge"      class="op-btn" data-op="edge">Edge (Prewitt)</button>
        </div>

        <div class="ops-group">
          <h3 class="ops-group-title">Noise</h3>
          <button id="btn-noise-add"    class="op-btn" data-op="noise-add"    data-params="amount">Add Noise</button>
          <button id="btn-noise-mean"   class="op-btn" data-op="noise-mean">Clean (Mean)</button>
          <button id="btn-noise-median" class="op-btn" data-op="noise-median">Clean (Median)</button>
        </div>

        <div class="ops-group">
          <h3 class="ops-group-title">Morphology</h3>
          <button id="btn-dilation" class="op-btn" data-op="dilation">Dilation</button>
          <button id="btn-erosion"  class="op-btn" data-op="erosion">Erosion</button>
          <button id="btn-opening"  class="op-btn" data-op="opening">Opening</button>
          <button id="btn-closing"  class="op-btn" data-op="closing">Closing</button>
        </div>

      </div>
    </section>

    <!-- Sonuç Paneli -->
    <section class="panel preview-panel">
      <h2 class="panel-title">Sonuç</h2>
      <div class="preview-grid">
        <div class="preview-box">
          <p class="preview-label">Orijinal</p>
          <img id="previewImg" class="preview-img" src="" alt="Orijinal görüntü" />
          <p class="preview-empty" id="origEmpty">Görüntü seçilmedi</p>
          <div id="origHistArea" class="hist-inline hidden">
            <p class="hist-inline-label">Histogram</p>
            <canvas id="origHistCanvas" width="512" height="150"></canvas>
          </div>
        </div>
        <div class="preview-box">
          <p class="preview-label">İşlenmiş</p>
          <div class="spinner hidden" id="spinner"></div>
          <img id="resultImg" class="preview-img" src="" alt="İşlenmiş görüntü" />
          <p class="preview-empty" id="resultEmpty">Bir işlem çalıştırın</p>
          <div id="procHistArea" class="hist-inline hidden">
            <p class="hist-inline-label">Histogram</p>
            <canvas id="procHistCanvas" width="512" height="150"></canvas>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script src="/static/js/app.js"></script>
</body>
</html>
